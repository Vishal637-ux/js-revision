<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div>
        <p class="eyebrow">Day 23</p>
        <h1>Todo App</h1>
      </div>

      <nav class="routes" aria-label="Todo routes">
        <a href="#/all" data-route="all">All</a>
        <a href="#/active" data-route="active">Active</a>
        <a href="#/completed" data-route="completed">Completed</a>
      </nav>
    </header>

    <form id="todo-form" class="todo-form">
      <label for="todo-input">Add a task</label>
      <div class="form-row">
        <input
          id="todo-input"
          type="text"
          placeholder="Write your next task..."
          autocomplete="off"
          required
        />
        <button type="submit">Add</button>
      </div>
    </form>

    <section class="toolbar" aria-live="polite">
      <p id="todo-count">0 tasks</p>
      <button id="clear-completed" type="button">Clear completed</button>
    </section>

    <ul id="todo-list" class="todo-list"></ul>
    <p id="empty-state" class="empty-state">No tasks here yet.</p>

    <section class="json-box">
      <h2>JSON data</h2>
      <pre id="json-output">[]</pre>
    </section>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
